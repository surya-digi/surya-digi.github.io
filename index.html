<!DOCTYPE html>
<html lang="en">
<head>

    <title>Surya-Digi | Welcome</title>

    <!-- Full-screen Background Video Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {

            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;

            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="3968318407-preview (online-video-cutter.com).mp4" type="video/mp4">
    </video>

    <table width="100%" height="100%">
        <!-- Blank spacer row taking up 40% of the screen height -->
        <tr height="40%">
            <td></td>
        </tr>
        <!-- Your heading row -->
        <tr>
            <td align="center" valign="top">
                <h1 style="color:#38BDF8;">Electronic Projects</h1>
            </td>
        </tr>
    </table>

</html>
